<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradient for outer circle -->
    <linearGradient id="hkbpBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f2557" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#hkbpBlueGrad)" stroke="#fbbf24" stroke-width="4" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="87" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Inner Circle Background -->
  <circle cx="100" cy="100" r="66" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />

  <!-- Sun Rays behind cross -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="100" y1="46" x2="100" y2="38" />
    <line x1="118" y1="52" x2="124" y2="46" />
    <line x1="130" y1="67" x2="138" y2="64" />
    <line x1="134" y1="87" x2="142" y2="87" />
    <line x1="82" y1="52" x2="76" y2="46" />
    <line x1="70" y1="67" x2="62" y2="64" />
    <line x1="66" y1="87" x2="58" y2="87" />
  </g>

  <!-- Curved Text Top: HURIA KRISTEN BATAK PROTESTAN -->
  <path id="textPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      HURIA KRISTEN BATAK PROTESTAN
    </textPath>
  </text>

  <!-- Curved Text Bottom: 1861 -->
  <path id="textPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#fbbf24" letter-spacing="3">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      HKBP • 1861
    </textPath>
  </text>

  <!-- Red Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="94" y="52" width="12" height="74" rx="2" fill="url(#crossGrad)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Horizontal bar -->
    <rect x="76" y="68" width="48" height="12" rx="2" fill="url(#crossGrad)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Open Bible at the base of the cross -->
  <g transform="translate(62, 114)">
    <!-- Bible Base / Pages Left -->
    <path d="M 38 12 Q 20 6 0 10 L 0 28 Q 20 24 38 30 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5" />
    <!-- Bible Base / Pages Right -->
    <path d="M 38 12 Q 56 6 76 10 L 76 28 Q 56 24 38 30 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5" />
    <!-- Center Crease -->
    <line x1="38" y1="12" x2="38" y2="30" stroke="#1e3a8a" stroke-width="2" />
    <!-- Scripture lines Left -->
    <line x1="8" y1="16" x2="30" y2="14" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="8" y1="20" x2="30" y2="18" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="8" y1="24" x2="26" y2="22" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <!-- Scripture lines Right -->
    <line x1="46" y1="14" x2="68" y2="16" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="46" y1="18" x2="68" y2="20" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="46" y1="22" x2="64" y2="24" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
